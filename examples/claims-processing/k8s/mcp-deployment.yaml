apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-claims-server
  labels:
    app: mcp-claims-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-claims-server
  template:
    metadata:
      labels:
        app: mcp-claims-server
    spec:
      containers:
        - name: mcp-claims-server
          image: mcp-claims-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-claims-server
spec:
  selector:
    app: mcp-claims-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
