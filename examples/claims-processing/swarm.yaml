apiVersion: swarm.kafkaagentswarm.io/v1alpha1
kind: AgentSwarm
metadata:
  name: claims-processing-swarm
  namespace: default
spec:
  kafka:
    brokers:
      - "host.k3d.internal:9092"
  nodes:
    - name: claims-ingest-agent
      type: Worker
      image: agent-runner:v1
      instructions: "Parse incoming raw insurance claim JSON payload."
      replicas: 1
      allowedTools:
        - "parse_claim_json"
      mcpServices:
        - name: claims-tools
          url: "http://mcp-claims-server:8000/sse"
      llm:
        baseURL: "http://host.k3d.internal:8001/v1"
        model: "Qwen3.8-27B-4bit"
        apiKeySecretRef:
          name: llm-credentials
          key: api-key

    - name: fraud-detection-agent
      type: Worker
      image: agent-runner:v1
      instructions: "Analyze historical claims patterns for fraud indicators."
      dependsOn:
        - claims-ingest-agent
      replicas: 2
      allowedTools:
        - "query_fraud_database"
        - "calculate_risk_score"
      mcpServices:
        - name: claims-tools
          url: "http://mcp-claims-server:8000/sse"
      llm:
        baseURL: "http://host.k3d.internal:8001/v1"
        model: "Qwen3.8-27B-4bit"
        apiKeySecretRef:
          name: llm-credentials
          key: api-key

    - name: coverage-verifier-agent
      type: Worker
      image: agent-runner:v1
      instructions: "Check policy limits and deductible balances."
      dependsOn:
        - claims-ingest-agent
      replicas: 2
      allowedTools:
        - "get_policy_coverage"
        - "get_deductible_balance"
      mcpServices:
        - name: claims-tools
          url: "http://mcp-claims-server:8000/sse"
      llm:
        baseURL: "http://host.k3d.internal:8001/v1"
        model: "Qwen3.8-27B-4bit"
        apiKeySecretRef:
          name: llm-credentials
          key: api-key

    - name: claim-decision-agent
      type: Worker
      image: agent-runner:v1
      instructions: "Aggregate risk score and policy checks into final decision."
      dependsOn:
        - fraud-detection-agent
        - coverage-verifier-agent
      replicas: 1
      allowedTools:
        - "synthesize_claim_summary"
      mcpServices:
        - name: claims-tools
          url: "http://mcp-claims-server:8000/sse"
      llm:
        baseURL: "http://host.k3d.internal:8001/v1"
        model: "Qwen3.8-27B-4bit"
        apiKeySecretRef:
          name: llm-credentials
          key: api-key

    - name: hitl-payout-approval
      type: HumanInTheLoop
      instructions: "Pause execution for human claims adjuster review."
      dependsOn:
        - claim-decision-agent
