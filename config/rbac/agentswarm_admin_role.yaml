# This rule is not used by the project kafkaagentswarm itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over swarm.kafkaagentswarm.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kafkaagentswarm
    app.kubernetes.io/managed-by: kustomize
  name: agentswarm-admin-role
rules:
- apiGroups:
  - swarm.kafkaagentswarm.io
  resources:
  - agentswarms
  verbs:
  - '*'
- apiGroups:
  - swarm.kafkaagentswarm.io
  resources:
  - agentswarms/status
  verbs:
  - get
