---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - swarm.kafkaagentswarm.io
  resources:
  - agentswarms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - swarm.kafkaagentswarm.io
  resources:
  - agentswarms/finalizers
  verbs:
  - update
- apiGroups:
  - swarm.kafkaagentswarm.io
  resources:
  - agentswarms/status
  verbs:
  - get
  - patch
  - update
